# Local development infrastructure only. The Go app runs on the host (`just api run`).
services:
  postgres:
    image: postgres:17
    container_name: moveit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moveit
      POSTGRES_PASSWORD: moveit
      POSTGRES_DB: moveit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  s3mock:
    image: adobe/s3mock
    container_name: moveit-s3mock
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: moveit
    ports:
      - "9090:9090"

  mailpit:
    image: axllent/mailpit
    container_name: moveit-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres-data:
